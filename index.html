<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emre Kaya</title>
<meta name="description" content="Emre Kaya: a statistics graduate who writes software, working toward data analysis and artificial intelligence.">
<meta property="og:title" content="Emre Kaya">
<meta property="og:description" content="Statistics and software: projects, background and how to reach me.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%235b3a9e' d='M1 1h6v2H4v1H3v1h4v2H1V5h2V4h1V3H1z'/%3E%3C/svg%3E">
<script>
try {
  const theme = localStorage.getItem('zypec-theme') || localStorage.getItem('pp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
} catch (unavailable) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/front.css">
<style>
/* Preprint: a statistician's portfolio set the way a good paper is. An opening, numbered sections, notes
   in the margin, a table with rules only where a table needs them, figures that are numbered and captioned.
   No ornament: the structure is the design. Everything it says is in content.md beside it. */

/* ── Settings: the values worth changing by hand. ── */
:root{
  --font-serif:Newsreader,Georgia,"Times New Roman",serif;   /* the name, the headings, the opening */
  --font-label:"IBM Plex Mono",ui-monospace,monospace;      /* numbers, labels, captions */
  --text-width:680px;      /* the column that is read */
  --margin-width:250px;    /* the column of notes and captions beside it, on a wide screen */
  --size-name:clamp(48px,7vw,76px);
  --size-section:30px;
  --accent:#5b3a9e; --accent-ink:#4c2f86; --accent-soft:#5b3a9e12; --accent-line:#5b3a9e40;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --accent:#b9a2f0; --accent-ink:#c9b6f5; --accent-soft:#b9a2f017; --accent-line:#b9a2f045}}
:root[data-theme=dark]{--accent:#b9a2f0; --accent-ink:#c9b6f5; --accent-soft:#b9a2f017; --accent-line:#b9a2f045}

main{max-width:calc(var(--text-width) + var(--margin-width) + 48px + 56px);counter-reset:figure table section}
.paper{max-width:var(--text-width)}
.content-error{color:var(--muted)}

/* The title block. */
.titleblock{padding:84px 0 36px;border-bottom:1px solid var(--line)}
.titleblock h1{font:500 var(--size-name)/1 var(--font-serif);letter-spacing:-.02em;margin:0}
.titleblock .role{font:italic 400 24px/1.3 var(--font-serif);color:var(--ink-2);margin:12px 0 30px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 28px;margin:0}
.facts div{display:flex;flex-direction:column;gap:3px}
.facts dt,.label{font:500 11.5px/1.3 var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
/* Links that act: a ruled box, so they read as something to press, with what they open as an icon. */
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:6px;
  font:500 13.5px/1 var(--font-label);color:var(--ink);background:var(--panel);transition:border-color .15s,color .15s}
.button:hover{text-decoration:none;border-color:var(--accent);color:var(--accent-ink)}
.button svg{width:15px;height:15px;flex:none}
.button .away{color:var(--muted);font-size:13px}

.abstract{padding:32px 0 8px}
.abstract p{font:400 21px/1.55 var(--font-serif);color:var(--ink-2);margin:10px 0 0}
.abstract .sidenote{font-family:var(--body)}

/* Sections, numbered in the margin as a paper numbers them. */
section{margin-top:64px;counter-increment:section;counter-reset:sub}
/* A subsection is numbered under its section: 2.1, 2.2. */
section>h3{display:flex;align-items:baseline;gap:14px;font:500 22px/1.2 var(--font-serif);margin:40px 0 14px;counter-increment:sub}
section>h3::before{content:counter(section) "." counter(sub);font:500 13px/1 var(--font-label);color:var(--accent);min-width:22px}
section>h2{display:flex;align-items:baseline;gap:18px;font:500 var(--size-section)/1.15 var(--font-serif);letter-spacing:-.01em;
  margin:0 0 20px}
section>h2::before{content:counter(section);font:500 15px/1 var(--font-label);color:var(--accent);min-width:22px}
.prose p,.prose li{color:var(--ink-2)}
.prose p{margin:0 0 16px}
.prose ul{padding-left:20px;margin:0 0 16px}
.prose li{margin-bottom:8px}
.prose strong{color:var(--ink);font-weight:600}

/* Notes in the margin: floated out of the column on a wide screen, set in under the line on a narrow one. */
.noteref{font:500 11px/0 var(--font-label);color:var(--accent);margin-left:1px}
.sidenote{display:block;margin:8px 0 8px 16px;padding-left:12px;border-left:2px solid var(--line-2);font-size:14px;line-height:1.55;
  color:var(--muted)}
.sidenote::before{content:attr(data-n) " ";font:500 11px/1 var(--font-label);color:var(--accent)}

/* A table, ruled the way booktabs rules one: heavy above and below, light under the heads, nothing between rows. */
.table{margin:8px 0 40px;counter-increment:table}
.table .caption{font-size:14px;color:var(--muted);margin:0 0 10px}
.table .caption::before{content:"Table " counter(table) ". ";font:500 12.5px/1 var(--font-label);color:var(--ink)}
.table .scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:14.5px}
th{font:500 11.5px/1.3 var(--font-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;
  padding:10px 14px 9px 0;border-bottom:1px solid var(--ink)}
td{padding:10px 14px 10px 0;color:var(--ink-2);vertical-align:top}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
td.empty{color:var(--muted);font-weight:400;white-space:normal;font-style:italic;padding:16px 0}

/* A project: its name with its color as a legend key, a numbered figure, what it is, its facts. */
.project{padding:30px 0;border-top:1px solid var(--line)}
.project:first-of-type{border-top:0}
.project h3{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:500 26px/1.2 var(--font-serif);margin:0 0 16px}
.project h3 .key{width:12px;height:12px;background:var(--c);flex:none}
.project h3 a{color:inherit}
.status{font:500 11px/1 var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line-2);padding:5px 7px}
.project figure{margin:0 0 18px;counter-increment:figure}
.project figure .frame{background:var(--stage);border:1px solid var(--line);aspect-ratio:16/9;overflow:hidden}
.project figure img{display:block;width:100%;height:100%;object-fit:cover}
.project figcaption{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:8px}
.project figcaption::before{content:"Figure " counter(figure) ". ";font:500 12px/1 var(--font-label);color:var(--ink)}
/* A project with no pictures yet draws what it is: here, the lines it runs. */
.lines{display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%;padding:0 9%}
.lines span{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:16px;color:#e9e4f1;font-size:14px}
.lines i{height:6px;background:var(--l)}
.project .body p{margin:0 0 14px;color:var(--ink-2)}
.project dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:18px 0 0;font-size:14.5px}
.project dt{font:500 11.5px/1.9 var(--font-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.project dd{margin:0;color:var(--ink-2)}
.project .open{margin-top:20px}

.colophon{margin:88px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);max-width:var(--text-width)}

/* On a wide screen the margin column opens: notes and captions move into it. */
@media (min-width:1100px){
  .paper{max-width:calc(var(--text-width) + var(--margin-width) + 48px + 56px);display:grid;grid-template-columns:var(--text-width) var(--margin-width);column-gap:48px}
  .paper>*{grid-column:1}
  .sidenote{float:right;clear:right;margin:4px calc(-1 * (var(--margin-width) + 48px)) 12px 0;width:var(--margin-width);
    border-left:0;padding-left:0}
  .project figure{display:grid;grid-template-columns:var(--text-width) var(--margin-width);column-gap:48px;width:calc(var(--text-width) + 48px + var(--margin-width))}
  .project figcaption{margin:0;align-self:end}
}
@media (max-width:640px){
  .titleblock{padding-top:48px}
  .titleblock .role{font-size:20px}
  .abstract p{font-size:19px}
  section>h2{font-size:25px;gap:12px}
  .lines span{grid-template-columns:84px minmax(0,1fr);font-size:13px}
}
</style>
</head>
<body>
<header>
  <a class="home" href="./">Emre Kaya</a>
  <nav>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
    <button id="theme" type="button" aria-live="polite"><span class="icon" aria-hidden="true"></span><span class="text"></span></button>
  </nav>
</header>

<main class="paper" data-content="content.md"></main>

<script src="kit/content.js"></script>
<script>
const {escape, inline} = Content;
const MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>';

Content.kind('title', block => `<div class="titleblock"><h1>${inline(block.one('name'))}</h1>`
  + `<p class="role">${inline(block.one('role'))}</p>`
  + `<dl class="facts">${block.pairs('fact').map(([label, value]) => `<div><dt>${inline(label)}</dt><dd>${inline(value)}</dd></div>`).join('')}</dl>`
  + `<div class="links">${block.pairs('link').map(([words, href]) => {
    const away = /^https?:/.test(href);
    return `<a class="button" href="${escape(href)}"${away ? ' target="_blank" rel="noopener"' : ''}>`
      + `${href.startsWith('mailto:') ? MAIL : ''}${inline(words)}${away ? '<span class="away" aria-hidden="true">↗</span>' : ''}</a>`;
  }).join('')}</div>`
  + `</div>`);

/** The opening words, under a label of their own: "About me" unless the block names another. */
Content.kind('about', block => `<div class="abstract"><span class="label">${inline(block.one('label') || 'About me')}</span>${block.html}</div>`);

/**
 * A table of projects: every project in the file of the table's group, a row each, its columns read from each
 * project's facts. A table with none says its empty line instead.
 */
Content.kind('projects', (block, _, blocks) => {
  const columns = block.pairs('columns')[0] || [];
  const group = block.one('group');
  const rows = blocks.filter(one => one.kind === 'project' && (!group || one.one('group') === group)).map(project => {
    const facts = Object.fromEntries(project.pairs('fact').map(([label, value]) => [label.toLowerCase(), value]));
    facts.status = project.one('status');
    return `<tr><td><a href="${escape(project.one('link'))}">${inline(project.one('name'))}</a></td>`
      + columns.map(column => `<td>${inline(facts[column.toLowerCase()] || '')}</td>`).join('') + '</tr>';
  });
  return `<div class="table"><p class="caption">${inline(block.one('caption') || 'Projects at a glance.')}</p><div class="scroll"><table>`
    + `<thead><tr><th>Project</th>${columns.map(column => `<th>${inline(column)}</th>`).join('')}</tr></thead>`
    + `<tbody>${rows.join('') || `<tr><td class="empty" colspan="${columns.length + 1}">${inline(block.one('empty'))}</td></tr>`}</tbody>`
    + '</table></div></div>';
});

Content.kind('project', block => {
  const name = inline(block.one('name')), link = escape(block.one('link'));
  const picture = block.one('image')
    ? `<img src="${escape(block.one('image'))}" alt="${escape(block.one('caption'))}" loading="lazy">`
    : `<div class="lines">${block.pairs('line').map(([line, color]) => `<span>${inline(line)}<i style="--l:${escape(color)}"></i></span>`).join('')}</div>`;
  const facts = block.pairs('fact').map(([label, value]) => `<dt>${inline(label)}</dt><dd>${inline(value)}</dd>`).join('');
  return `<article class="project" style="--c:${escape(block.one('color') || 'var(--accent)')}">`
    + `<h3><span class="key"></span><a href="${link}">${name}</a>${block.one('status') ? `<span class="status">${inline(block.one('status'))}</span>` : ''}</h3>`
    + `<figure><div class="frame">${picture}</div>${block.one('caption') ? `<figcaption>${inline(block.one('caption'))}</figcaption>` : ''}</figure>`
    + `<div class="body">${block.html}</div>${facts ? `<dl>${facts}</dl>` : ''}`
    + `<a class="button open" href="${link}">${inline(block.one('open') || 'Open ' + block.one('name'))} →</a></article>`;
});

Content.kind('colophon', block => `<footer class="colophon">${block.html}</footer>`);
</script>
<script src="kit/theme.js"></script>
</body>
</html>
